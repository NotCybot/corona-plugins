#:schema /run/current-system/sw/share/corona/schema/plugin.schema.json
id = "test"
name = "Dashboard"
version = "0.1.1"
description = "A test plugin"

# a bar button; shown as `test:test` in a bar
[widgets.test]
view = "widget.js"
name = "Test"

# opened by the widget, as `test:main`
[panels.main]
view = "panel.js"
name = "Test"
width = 360
height = 240

[[settings]]
key = "label"
label = "Label"
type = "text"
default = "Test"

[capabilities]
corona = ["notifications"]
